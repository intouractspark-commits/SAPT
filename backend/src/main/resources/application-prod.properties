# ============================================================
# SAPT - Production Profile
# Active when: spring.profiles.active=prod
# ============================================================

# Disable SQL logging in production
spring.jpa.show-sql=false

# No DDL changes in production (validate skipped - PostgreSQL bpchar/varchar type compatibility)
spring.jpa.hibernate.ddl-auto=none

# Minimal logging in production
logging.level.com.sapt=WARN
logging.level.org.springframework=ERROR

# CORS - restrict to production frontend domain only
sapt.cors.allowed-origins=${ALLOWED_ORIGINS:https://your-frontend-domain.com}

# Seed disabled in production — set APP_SEED_ENABLED=true only in dev .env to run seeder
app.seed.enabled=false

# Disable server-side prepared statements (required for Supabase/PgBouncer)
spring.datasource.hikari.data-source-properties.prepareThreshold=0
