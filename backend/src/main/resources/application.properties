# ============================================================
# SAPT - Student Activity & Performance Tracker
# Main Application Properties
# All sensitive values are read from .env via dotenv-java.
# DO NOT hardcode credentials here.
# ============================================================

# --- Active Profile ---
spring.profiles.active=${APP_ENV:dev}

# --- Server ---
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# --- Application Name ---
spring.application.name=sapt-backend

# --- Supabase PostgreSQL DataSource ---
spring.datasource.url=${PG_URL}
spring.datasource.username=${PG_USERNAME}
spring.datasource.password=${PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP Connection Pool (tuned for Supabase) ---
# Supabase silently drops idle TCP connections after ~5 min.
# These settings ensure stale connections are detected and evicted before use.
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
# Evict connections idle for more than 4 min (before Supabase kills them at 5 min)
spring.datasource.hikari.idle-timeout=240000
# Test a connection before handing it to the app — catches dead sockets
spring.datasource.hikari.connection-test-query=SELECT 1
# If a test-query or connection attempt takes >5s, treat the connection as dead
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
# Keep-alive ping every 2 min to prevent Supabase from killing idle connections
spring.datasource.hikari.keepalive-time=120000
# Max lifetime of any connection — recycle before Supabase's hard limit
spring.datasource.hikari.max-lifetime=600000
# Disable server-side prepared statements (required for Supabase/PgBouncer in transaction mode)
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- MongoDB ---
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=${MONGO_DATABASE}
# Prevent MongoDB connection issues from blocking startup
# serverSelectionTimeoutMS: 5s to fail fast if Atlas unreachable
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.uuid-representation=standard

# --- JWT ---
sapt.jwt.secret=${JWT_SECRET}
sapt.jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Mail (SMTP) ---
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --- File Upload ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# --- Logging ---
logging.level.com.sapt=INFO
logging.level.org.springframework.security=INFO
logging.file.name=logs/sapt.log

# --- DatabaseSeeder ---
# DatabaseSeeder disabled by default; set app.seed.enabled=true in dev .env to enable
app.seed.enabled=false
